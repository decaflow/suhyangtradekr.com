<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이트 준비 중 (Under Construction)</title>
    <style>
        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 전체 높이 사용 */
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #ff3c00;
        }
        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            font-weight: 900;
        }
        h1 span {
            color: #ff3c00; /* 오렌지색 포인트 */
        }
        p {
            font-size: 16px;
            color: #cccccc;
            line-height: 1.6;
            margin-top: 0;
        }
        .contact {
            margin-top: 40px;
            font-size: 14px;
            color: #777777;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .contact a {
            color: #ff3c00;
            text-decoration: none;
        }
        
        /* 아이콘 깜빡임 애니메이션 */
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 부드럽게 움직이는 공사 아이콘 -->
    <div class="icon pulse">🚧</div>
    
    <h1><span>SITE</span> UNDER CONSTRUCTION</h1>
    <p>현재 웹사이트 리뉴얼 및 오픈 준비 중입니다.<br>최상의 서비스를 위해 조금만 기다려주세요.</p>
    
    <div class="contact">
        서비스 관련 문의는 아래 이메일로 연락 부탁드립니다.<br>
        <!-- 본인의 이메일 주소로 변경하세요 -->
        E-mail : <a href="mailto:your-email@gmail.com">your-email@gmail.com</a>
    </div>

</body>
</html>
